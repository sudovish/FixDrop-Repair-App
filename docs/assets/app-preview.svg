<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="FixDrop real app screenshots from the iOS app">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#1f163d" flood-opacity="0.20"/>
    </filter>
    <style>
      .title{font:700 48px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#1f163d}
      .sub{font:500 22px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#635985}
      .label{font:700 18px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;fill:#4f466f}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f7f3ff"/>
  <rect x="54" y="48" width="1092" height="664" rx="42" fill="#ffffff"/>
  <image href="data:image/jpeg;base64," x="92" y="84" width="86" height="86" preserveAspectRatio="xMidYMid meet"/>
  <text x="204" y="122" class="title">FixDrop 5.2</text>
  <text x="206" y="160" class="sub">Actual iOS app screenshots from the Downloads/FixDrop-5-2 build</text>

  <g transform="translate(258 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="292" height="482" rx="40" fill="#181425"/>
    <rect x="12" y="14" width="268" height="454" rx="30" fill="#ffffff"/>
    <image href="data:image/jpeg;base64," x="21" y="24" width="250" height="434" preserveAspectRatio="xMidYMin slice"/>
  </g>
  <text x="318" y="728" class="label">Customer home</text>

  <g transform="translate(650 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="292" height="482" rx="40" fill="#181425"/>
    <rect x="12" y="14" width="268" height="454" rx="30" fill="#ffffff"/>
    <image href="data:image/jpeg;base64," x="21" y="24" width="250" height="434" preserveAspectRatio="xMidYMin slice"/>
  </g>
  <text x="716" y="728" class="label">Profile settings</text>
</svg>